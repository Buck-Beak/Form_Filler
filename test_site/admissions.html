<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration steps — Demo</title>
    <style>
        :root {
            --bg: #eef4ff;
            --card: #ffffff;
            --text: #0f1f39;
            --muted: #4f6280;
            --primary: #1d4ed8;
            --success: #16a34a;
            --success-strong: #15803d;
            --border: #d3e1f4;
            --shadow: 0 22px 50px rgba(16, 36, 70, 0.16);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(900px 500px at -10% -20%, #dbeafe 0%, transparent 65%),
                radial-gradient(900px 500px at 110% 120%, #dbeafe 0%, transparent 65%),
                var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 18px;
        }
        main {
            width: min(760px, 100%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 34px;
            box-shadow: var(--shadow);
        }
        h1 { margin: 0 0 14px; font-size: clamp(1.7rem, 3.5vw, 2.2rem); letter-spacing: -0.02em; }
        ol { margin: 0; padding-left: 24px; color: var(--muted); line-height: 1.9; font-size: 1.06rem; }
        a.cta {
            display: inline-block;
            margin-top: 26px;
            text-decoration: none;
            background: linear-gradient(135deg, var(--success), #22c55e);
            color: #fff;
            padding: 15px 24px;
            border-radius: 12px;
            font-weight: 700;
            box-shadow: 0 10px 22px rgba(22, 163, 74, 0.26);
            transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
        }
        a.cta:hover { transform: translateY(-2px); box-shadow: 0 16px 28px rgba(22, 163, 74, 0.32); background: linear-gradient(135deg, var(--success-strong), var(--success)); }
        a.back { display: inline-block; margin-top: 20px; color: var(--primary); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <h1>Before you apply</h1>
        <ol>
            <li>Read the eligibility criteria (demo text only).</li>
            <li>Keep your identification and contact details ready.</li>
            <li>Use the button below to open the online application form.</li>
        </ol>
        <a class="cta" href="captcha.html">Start new application — fill form online</a>
        <a class="back" href="index.html">← Back</a>
    </main>
</body>
</html>
