<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Demo</title>
    <style>
        :root {
            --bg: #eef4ff;
            --card: #ffffff;
            --text: #0f1f39;
            --muted: #4f6280;
            --primary: #1d4ed8;
            --danger: #dc2626;
            --danger-strong: #b91c1c;
            --border: #d3e1f4;
            --border-strong: #c5d4e8;
            --shadow: 0 22px 50px rgba(16, 36, 70, 0.16);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(900px 500px at -10% -20%, #dbeafe 0%, transparent 65%),
                radial-gradient(900px 500px at 110% 120%, #dbeafe 0%, transparent 65%),
                var(--bg);
            color: var(--text);
            padding: 24px 16px;
        }
        main {
            width: min(380px, 100%);
            margin: 20px auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            box-shadow: var(--shadow);
        }
        h1 { margin: 0 0 10px; font-size: clamp(1.3rem, 2.4vw, 1.6rem); letter-spacing: -0.01em; }
        p { margin: 0 0 14px; color: var(--muted); font-size: 0.94rem; line-height: 1.55; }
        form { margin: 0; }
        label { display: block; margin-top: 10px; font-size: 0.88rem; font-weight: 600; color: #1f334f; }
        input {
            width: 100%;
            padding: 9px 10px;
            margin-top: 6px;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            font: inherit;
            outline: none;
            transition: border-color .12s ease, box-shadow .12s ease;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15); }
        button {
            margin-top: 14px;
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, var(--danger), #ef4444);
            color: #fff;
            border: none;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(220, 38, 38, 0.26);
            transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 16px 28px rgba(220, 38, 38, 0.32); background: linear-gradient(135deg, var(--danger-strong), var(--danger)); }
        a { display: inline-block; margin-top: 12px; color: var(--primary); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <h1>Login</h1>
        <p>Demo-only staff login to test optional navigation paths.</p>
        <form id="loginForm">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
        </form>
        <a href="index.html">← Back to home</a>
    </main>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Login successful!');
            window.location.href = 'captcha.html';
        });
    </script>
</body>
</html>
