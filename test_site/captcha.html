<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security check — Demo</title>
    <style>
        :root {
            --bg: #eef4ff;
            --card: #ffffff;
            --text: #0f1f39;
            --muted: #4f6280;
            --primary: #1d4ed8;
            --success: #16a34a;
            --success-strong: #15803d;
            --border: #d3e1f4;
            --shadow: 0 22px 50px rgba(16, 36, 70, 0.16);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(900px 500px at -10% -20%, #dbeafe 0%, transparent 65%),
                radial-gradient(900px 500px at 110% 120%, #dbeafe 0%, transparent 65%),
                var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 18px;
        }
        main {
            width: min(700px, 100%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 34px;
            box-shadow: var(--shadow);
        }
        h1 { margin: 0 0 12px; font-size: clamp(1.7rem, 3.5vw, 2.2rem); letter-spacing: -0.02em; }
        p { margin: 0; line-height: 1.75; color: var(--muted); font-size: 1.02rem; }
        .g-recaptcha { margin: 24px 0 10px; }
        a.cta {
            display: inline-block;
            margin-top: 16px;
            padding: 13px 22px;
            background: linear-gradient(135deg, var(--success), #22c55e);
            color: #fff !important;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            pointer-events: none;
            opacity: 0.45;
            box-shadow: 0 10px 22px rgba(22, 163, 74, 0.26);
            transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
        }
        a.cta.ready { pointer-events: auto; opacity: 1; }
        a.cta.ready:hover { transform: translateY(-2px); box-shadow: 0 16px 28px rgba(22, 163, 74, 0.32); background: linear-gradient(135deg, var(--success-strong), var(--success)); }
        a.back { display: inline-block; margin-top: 20px; color: var(--primary); text-decoration: none; font-weight: 700; }
        .note { font-size: 0.94rem; color: #64748b; margin-top: 18px; }
    </style>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
    <main>
        <h1>Security check (demo)</h1>
        <p>Complete the challenge below to continue to the application form. This page uses Google’s <strong>public test</strong> reCAPTCHA key for local automation practice.</p>

        <div
            class="g-recaptcha"
            data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"
            data-callback="captchaDemoCallback"
        ></div>

        <a id="continueApp" class="cta" href="#" aria-disabled="true">Continue to application form</a>

        <p class="note">Flow: landing → instructions → <strong>this page</strong> → application form.</p>
        <a class="back" href="admissions.html">← Back to steps</a>
    </main>
    <script>
        function captchaDemoCallback(token) {
            window.__demoRecaptchaToken = token;
            var a = document.getElementById('continueApp');
            a.href = 'form.html';
            a.classList.add('ready');
            a.setAttribute('aria-disabled', 'false');
        }
    </script>
</body>
</html>
