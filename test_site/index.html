<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Registration — Demo</title>
    <style>
        :root {
            --bg: #eef4ff;
            --card: #ffffff;
            --text: #0f1f39;
            --muted: #4f6280;
            --primary: #1d4ed8;
            --primary-strong: #1e40af;
            --border: #d3e1f4;
            --shadow: 0 22px 50px rgba(16, 36, 70, 0.16);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(900px 500px at -10% -20%, #dbeafe 0%, transparent 65%),
                radial-gradient(900px 500px at 110% 120%, #dbeafe 0%, transparent 65%),
                var(--bg);
            color: var(--text);
            padding: 24px 16px;
        }
        main {
            width: min(640px, 100%);
            margin: 20px auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            box-shadow: var(--shadow);
        }
        h1 { margin: 0 0 10px; font-size: clamp(1.4rem, 2.6vw, 1.8rem); line-height: 1.2; letter-spacing: -0.01em; }
        p { margin: 0; line-height: 1.6; color: var(--muted); font-size: 0.98rem; max-width: 62ch; }
        nav { margin-top: 18px; display: grid; gap: 10px; }
        a.cta {
            text-decoration: none;
            text-align: center;
            background: linear-gradient(135deg, var(--primary), #2563eb);
            color: #fff;
            padding: 11px 14px;
            border-radius: 9px;
            font-weight: 700;
            box-shadow: 0 10px 22px rgba(29, 78, 216, 0.26);
            transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
        }
        a.cta:hover { transform: translateY(-2px); box-shadow: 0 16px 28px rgba(29, 78, 216, 0.32); background: linear-gradient(135deg, var(--primary-strong), var(--primary)); }
        a.sub { text-align: center; color: var(--primary); font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <h1>Demo examination registration</h1>
        <p>
            This static site mimics a multi-step flow (landing → instructions → verification step → application form)
            for testing the Telegram bot’s navigation, optional challenge pages, and auto-fill.
        </p>
        <nav>
            <a class="cta" href="admissions.html">Continue to registration steps</a>
            <a class="sub" href="about.html">About this demo</a>
        </nav>
    </main>
</body>
</html>
