<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About — Demo</title>
    <style>
        :root {
            --bg: #eef4ff;
            --card: #ffffff;
            --text: #0f1f39;
            --muted: #4f6280;
            --primary: #1d4ed8;
            --border: #d3e1f4;
            --shadow: 0 22px 50px rgba(16, 36, 70, 0.16);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(900px 500px at -10% -20%, #dbeafe 0%, transparent 65%),
                radial-gradient(900px 500px at 110% 120%, #dbeafe 0%, transparent 65%),
                var(--bg);
            color: var(--text);
            padding: 24px 16px;
        }
        main {
            width: min(640px, 100%);
            margin: 20px auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            box-shadow: var(--shadow);
        }
        h1 { margin: 0 0 10px; font-size: clamp(1.35rem, 2.6vw, 1.75rem); letter-spacing: -0.01em; }
        p { margin: 0; line-height: 1.6; color: var(--muted); font-size: 0.98rem; }
        .links { margin-top: 14px; display: flex; gap: 12px; flex-wrap: wrap; }
        .links a { color: var(--primary); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <h1>About this demo</h1>
        <p>
            Static pages for local testing of Playwright navigation, a reCAPTCHA demo step (<code>captcha.html</code>), and form extraction.
            There is no backend; submit shows a JavaScript alert only.
        </p>
        <div class="links">
            <a href="index.html">← Back</a>
            <a href="login.html">Staff login (optional manual test)</a>
        </div>
    </main>
</body>
</html>
